<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SECS Demo</title><style>body{font-family:system-ui,sans-serif;background:#f4f8f7;color:#193b36;margin:0}header{background:#137b69;color:white;padding:20px}main{max-width:900px;margin:auto;padding:16px}.tabs{display:flex;flex-wrap:wrap;gap:8px}button{border:0;border-radius:9px;padding:11px 15px;background:#dcece7;color:#164d43;cursor:pointer}.active,.primary{background:#137b69;color:white}.panel{background:white;border-radius:15px;padding:20px;margin-top:15px;box-shadow:0 2px 9px #0001}label{display:block;margin:12px 0 5px}input,select{padding:10px;border:1px solid #bccdc7;border-radius:8px;box-sizing:border-box;width:100%;max-width:450px}.item{padding:12px;border-bottom:1px solid #e3ebe8}.muted{color:#60746f}.warn{color:#a66a05}.bad{color:#b32626}.good{color:#168050}.pill{display:inline-block;border-radius:20px;padding:4px 10px;background:#fcebc6}.hidden{display:none}</style></head><body><header><h2>SMART Emergency Cart System (SECS)</h2><div>ต้นแบบระบบตรวจสอบและบริหารจัดการรถอุปกรณ์ช่วยฟื้นคืนชีพ</div></header><main><nav class="tabs" id="tabs"></nav><section id="view" class="panel"></section><p class="muted">ต้นแบบสาธิต: ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น ไม่เหมาะสำหรับบันทึกข้อมูลจริงของโรงพยาบาล</p></main><script>
const names=['Dashboard','ตรวจประจำวัน','เปิดรถ / ตรวจใหม่','เบิกทดแทน','รับของใหม่','วันหมดอายุ','ประวัติ'];const key='secs_demo_v2';const defaults=[{id:'CPR',name:'CPR Box',qty:1,expiry:'2027-04-30'},{id:'ET',name:'ET Tube',qty:2,expiry:'2027-06-30'},{id:'SYR',name:'Syringe',qty:5,expiry:'2028-01-31'},{id:'NSS',name:'NSS',qty:2,expiry:'2027-08-31'},{id:'AIR',name:'Airway',qty:2,expiry:'2028-02-28'},{id:'LAR',name:'Laryngoscope/Blade',qty:1,expiry:''},{id:'TOR',name:'ไฟฉาย',qty:1,expiry:''}];let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}state||={items:defaults,pending:[],history:[],sealed:true,seal:'123456',lastDaily:''};let tab=0;function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function el(id){return document.getElementById(id)}function option(items){return items.map(i=>`<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('')}function addHistory(type,details){state.history.unshift({date:new Date().toLocaleString('th-TH'),type,details});save()}function render(){el('tabs').innerHTML=names.map((n,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()">${n}</button>`).join('');let html='';if(tab===0){let exp=state.items.filter(i=>i.expiry&&((new Date(i.expiry)-new Date())/864e5)<=30);html=`<h3>ภาพรวมความพร้อม</h3><p>สถานะซีล: <b class="${state.sealed?'good':'bad'}">${state.sealed?'ซีลแล้ว':'ยังไม่สามารถซีล'}</b> · เลขซีล ${esc(state.seal)}</p><p>ตรวจประจำวันวันนี้: <b>${state.lastDaily===new Date().toISOString().slice(0,10)?'ตรวจแล้ว':'ยังไม่ได้ตรวจ'}</b></p><p>รายการรอเบิกทดแทน: <b>${state.pending.filter(x=>x.remaining>0).length}</b> · ใกล้หมดอายุ/หมดอายุ: <b>${exp.length}</b></p><p class="muted">เมื่อรับของครบแล้ว ให้ตรวจทุกรายการโดยผู้ตรวจ 2 คนก่อนซีลใหม่</p>`}else if(tab===1){html=`<h3>ตรวจประจำวัน (รถซีล)</h3><p>ตรวจเฉพาะ Laryngoscope/Blade และไฟฉาย</p><label>ผู้ตรวจ</label><input id="inspector" placeholder="ชื่อผู้ตรวจ"><label>Laryngoscope/Blade</label><select id="lar"><option>พร้อมใช้งาน</option><option>ต้องเปลี่ยน</option></select><label>ไฟฉาย</label><select id="tor"><option>พร้อมใช้งาน</option><option>ต้องเปลี่ยน</option></select><p><button class="primary" onclick="daily()">บันทึกการตรวจ</button></p>`}else if(tab===2){html=`<h3>เปิดรถ / ตรวจใหม่</h3><label>เหตุผลการเปิดรถ</label><select id="reason"><option>เปิดรถและใช้ของ</option><option>เปิดรถแต่ไม่ได้ใช้ของ</option></select><label>ผู้ตรวจคนที่ 1</label><input id="a" placeholder="ชื่อผู้ตรวจ"><label>ผู้ตรวจคนที่ 2</label><input id="b" placeholder="ชื่อผู้ตรวจ"><p>ตรวจทุกรายการ</p>${state.items.map(i=>`<div class="item"><label><input style="width:auto" type="checkbox" class="full" data-id="${esc(i.id)}"> ${esc(i.name)} — ครบและพร้อมใช้งาน</label></div>`).join('')}<label>เลขซีลใหม่</label><input id="seal" placeholder="เลขซีลใหม่"><p><button class="primary" onclick="fullCheck()">บันทึกผล / ซีลรถ</button></p><p class="warn">หากยังมีรายการรอเบิกหรืออุปกรณ์ไม่ครบ จะไม่อนุญาตให้ซีล</p>`}else if(tab===3){html=`<h3>เบิกทดแทน</h3><label>รายการที่ใช้ / ขาด</label><select id="pendingItem">${option(state.items)}</select><label>จำนวนที่ต้องเบิก</label><input id="pendingQty" type="number" min="1" value="1"><label>หมายเหตุ</label><input id="pendingNote" placeholder="เช่น ใช้ระหว่างหัตถการ"><p><button class="primary" onclick="requestItem()">บันทึกรอเบิก</button></p><h3>รายการค้างเบิก</h3>${state.pending.filter(p=>p.remaining>0).map(p=>`<div class="item">${esc(state.items.find(i=>i.id===p.id)?.name||p.id)} · รอ ${p.remaining} ชิ้น <span class="pill">รอรับของ</span></div>`).join('')||'<p>ไม่มีรายการค้างเบิก</p>'}` }else if(tab===4){html=`<h3>รับของใหม่</h3><label>รายการ</label><select id="receivedItem">${option(state.items)}</select><label>จำนวนที่ได้รับ</label><input id="receivedQty" type="number" min="1" value="1"><label>วันหมดอายุใหม่</label><input id="receivedExpiry" type="date"><label>ผู้รับของ</label><input id="receiver" placeholder="ชื่อผู้รับ"><p><button class="primary" onclick="receive()">บันทึกรับของใหม่</button></p><p class="muted">CPR Box เปลี่ยนทั้งกล่อง และบันทึกวันหมดอายุตามกล่อง</p>`}else if(tab===5){html=`<h3>ติดตามวันหมดอายุ</h3>${state.items.map(i=>{let d=i.expiry?Math.ceil((new Date(i.expiry)-new Date())/864e5):null;return `<div class="item"><b>${esc(i.name)}</b> · ${i.expiry?esc(i.expiry):'ไม่ระบุวันหมดอายุ'} ${d===null?'':`<span class="${d<=7?'bad':d<=30?'warn':'good'}">(${d<0?'หมดอายุแล้ว':`เหลือ ${d} วัน`})</span>`}</div>`}).join('')}` }else{html=`<h3>ประวัติการดำเนินงาน</h3>${state.history.map(h=>`<div class="item"><b>${esc(h.type)}</b> <small>${esc(h.date)}</small><p>${esc(h.details)}</p></div>`).join('')||'ยังไม่มีประวัติ'}`}el('view').innerHTML=html}function daily(){let name=el('inspector').value.trim();if(!name)return alert('กรุณาระบุผู้ตรวจ');state.lastDaily=new Date().toISOString().slice(0,10);addHistory('ตรวจประจำวัน',`${name}: Laryngoscope ${el('lar').value}, ไฟฉาย ${el('tor').value}`);if(el('lar').value==='ต้องเปลี่ยน'||el('tor').value==='ต้องเปลี่ยน')state.sealed=false;save();render()}function requestItem(){let id=el('pendingItem').value,q=+el('pendingQty').value;if(!Number.isInteger(q)||q<1)return alert('ระบุจำนวนที่ถูกต้อง');state.pending.push({id,remaining:q});state.sealed=false;addHistory('เบิกทดแทน',`${id} ${q} ชิ้น: ${el('pendingNote').value}`);render()}function receive(){let id=el('receivedItem').value,q=+el('receivedQty').value,expiry=el('receivedExpiry').value,who=el('receiver').value.trim();if(!Number.isInteger(q)||q<1||!who)return alert('กรุณาระบุจำนวนและผู้รับของ');if(id==='CPR'&&q!==1)return alert('CPR Box ต้องรับเป็นกล่อง โปรดบันทึกทีละกล่อง');if(!expiry&&id!=='LAR'&&id!=='TOR')return alert('กรุณาระบุวันหมดอายุ');let item=state.items.find(i=>i.id===id);item.expiry=expiry||item.expiry;let left=q;for(let p of state.pending.filter(p=>p.id===id&&p.remaining>0)){let used=Math.min(left,p.remaining);p.remaining-=used;left-=used;if(!left)break}state.sealed=false;addHistory('รับของใหม่',`${item.name} ${q} ชิ้น วันหมดอายุ ${expiry||'-'} ผู้รับ ${who}`);render()}function fullCheck(){let a=el('a').value.trim(),b=el('b').value.trim(),checks=[...document.querySelectorAll('.full')];if(!a||!b||a===b)return alert('กรุณาระบุผู้ตรวจ 2 คนที่แตกต่างกัน');let ready=checks.every(c=>c.checked)&&!state.pending.some(p=>p.remaining>0);let seal=el('seal').value.trim();if(ready&&!seal)return alert('กรุณาระบุเลขซีลใหม่');state.sealed=ready;if(ready)state.seal=seal;addHistory('ตรวจรถใหม่',`${el('reason').value}; ผู้ตรวจ ${a}, ${b}; ${ready?'ซีลใหม่ '+seal:'ยังไม่พร้อมซีล'}`);render();alert(ready?'บันทึกและซีลรถเรียบร้อย':'บันทึกแล้ว แต่ยังซีลรถไม่ได้ เนื่องจากรายการไม่ครบหรือยังรอเบิก')}render();
</script></body></html>
